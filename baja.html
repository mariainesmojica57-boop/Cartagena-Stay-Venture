<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Darse de baja · Cartagena Stay Venture</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="assets/img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .baja { min-height: 100vh; display: grid; place-items: center; padding: 40px 20px;
      background: radial-gradient(1000px 500px at 50% -10%, var(--sky-100), transparent 60%), var(--cream); }
    .baja__card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md); padding: 40px 32px; max-width: 480px; width: 100%; text-align: center; }
    .baja__logo { height: 84px; width: auto; margin: 0 auto 18px; }
    .baja__card h1 { font-size: 1.6rem; margin-bottom: 10px; }
    .baja__card p { color: var(--muted); margin-bottom: 8px; }
    .baja__actions { display: none; flex-direction: column; gap: 12px; margin-top: 24px; }
    .baja__spin { width: 34px; height: 34px; margin: 6px auto 16px; border: 3px solid var(--sky-100);
      border-top-color: var(--sky); border-radius: 50%; animation: baja-spin .8s linear infinite; }
    @keyframes baja-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="baja">
    <div class="baja__card">
      <img class="baja__logo" src="assets/img/logo.png" alt="Cartagena Stay Venture" />
      <div class="baja__spin" id="spin"></div>
      <h1 id="titulo">Un momento…</h1>
      <p id="texto">Estamos procesando tu solicitud.</p>
      <div class="baja__actions" id="acciones">
        <a class="btn btn--wa btn--block" id="waBtn" href="https://wa.me/573052080277" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.8 4.9-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-2.9.8.8-2.8-.2-.3A8.2 8.2 0 1 1 12 20.2zM17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.2-.6.1-.2.3-.7.9-.8 1.1-.2.2-.3.2-.6.1-1.6-.8-2.6-1.4-3.7-3.2-.3-.5.3-.5.8-1.5.1-.2 0-.3 0-.5s-.6-1.6-.9-2.2c-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.3-.3.3-1 .9-1 2.3s1 2.7 1.2 2.9c.1.2 2 3.1 5 4.3 1.8.8 2.5.8 3.4.7.5-.1 1.7-.7 1.9-1.4.2-.6.2-1.2.2-1.3-.1-.2-.3-.3-.6-.4z"/></svg>
          Escríbenos por WhatsApp</a>
        <a class="btn btn--outline btn--block" href="index.html">Volver al inicio</a>
      </div>
    </div>
  </main>

  <script>
  (function () {
    /* La baja se procesa vía /api/baja (función serverless en Vercel) para
       evitar el bloqueo de CORS del navegador. */
    var email = new URLSearchParams(location.search).get('email');
    var t = document.getElementById('titulo');
    var p = document.getElementById('texto');
    var acc = document.getElementById('acciones');
    var spin = document.getElementById('spin');
    var waBtn = document.getElementById('waBtn');

    function stop() { if (spin) spin.style.display = 'none'; }
    function showActions(msg) {
      if (waBtn) {
        var txt = 'Hola Cartagena Stay Venture, quiero darme de baja de las comunicaciones.' + (email ? ' Mi correo: ' + email : '');
        waBtn.href = 'https://wa.me/573052080277?text=' + encodeURIComponent(txt);
      }
      if (acc) acc.style.display = 'flex';
    }

    if (!email) {
      stop();
      t.textContent = 'Enlace no válido';
      p.textContent = 'Al enlace le falta la dirección de correo. Escríbenos y te damos de baja enseguida.';
      showActions();
    } else {
      fetch('/api/baja?email=' + encodeURIComponent(email))
        .then(function (r) { return r.json().catch(function () { return { ok: r.ok }; }); })
        .then(function (d) {
          if (!d || !d.ok) throw new Error('notok');
          stop();
          t.textContent = '¡Listo! Te diste de baja';
          p.textContent = 'No volverás a recibir nuestras comunicaciones. Gracias por haberte alojado con Cartagena Stay Venture. 🧡';
        })
        .catch(function () {
          stop();
          t.textContent = 'No pudimos completarlo automáticamente';
          p.textContent = 'Escríbenos por WhatsApp y te damos de baja a mano.';
          showActions();
        });
    }
  })();
  </script>
</body>
</html>
